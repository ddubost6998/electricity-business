version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: eb_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: electricity_business
      MYSQL_USER: eb_user
      MYSQL_PASSWORD: eb_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: eb_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: eb_user
      PMA_PASSWORD: eb_password
    depends_on:
      - mysql

volumes:
  mysql_data:
