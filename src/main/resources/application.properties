spring.application.name=electricity-business
spring.jpa.open-in-view=false

# Configuration JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600

# Configuration H2
#spring.datasource.url=jdbc:h2:mem:electricity_business
#spring.datasource.driverClassName=org.h2.Driver
#spring.h2.console.enabled=true
#spring.jpa.hibernate.ddl-auto=update

# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/electricity_business
spring.datasource.username=eb_user
spring.datasource.password=eb_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuration Spring Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# SpringDoc OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packagesToScan=fr.humanbooster.electricity_business.controller
springdoc.pathsToMatch=/api/**

